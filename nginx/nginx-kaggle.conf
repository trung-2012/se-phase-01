worker_processes 2;
pid /tmp/cinema-nginx.pid;
error_log /tmp/cinema-nginx-error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log /tmp/cinema-nginx-access.log;
    client_body_temp_path /tmp/cinema-nginx-body;
    proxy_temp_path /tmp/cinema-nginx-proxy;
    fastcgi_temp_path /tmp/cinema-nginx-fastcgi;
    uwsgi_temp_path /tmp/cinema-nginx-uwsgi;
    scgi_temp_path /tmp/cinema-nginx-scgi;

    upstream cinema_backend {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:8088;

        location / {
            proxy_pass http://cinema_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Addr $upstream_addr always;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}