services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - rate_limit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      retries: 10
    networks:
      - rate-limit-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - rate-limit-net

  app:
    build: .
    image: cinema-rate-limit-lab:current
    environment: &app-environment
      DB_URL: jdbc:postgresql://db:5432/cinema
      DB_USERNAME: cinema
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cinema.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_MAX_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_TRUSTED_PROXY_IPS: "172.30.55.10"
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rate-limit-net

  app-2:
    image: cinema-rate-limit-lab:current
    pull_policy: never
    environment: *app-environment
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rate-limit-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - app-2
    networks:
      rate-limit-net:
        ipv4_address: 172.30.55.10

networks:
  rate-limit-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.55.0/24

volumes:
  rate_limit_pgdata:
